[project]
name = "eco-supply"
version = "0.1.0"
description = "한국환경공단 환경기초시설 관급자재 SR(사회적 가치) 공급망 분석 및 발주 의사결정 지원"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = []

# ── 핵심 의존성 (수집·정제 + 운영 API) ─────────────────
# API 서버 deps 도 여기에 포함 (Railway 등 PaaS 자동 install 대응)
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

# ── 단계별 추가 의존성 ──────────────────────────────────
# 사용 예:
#   uv sync                       # 핵심 + API (운영 기본)
#   uv sync --extra analysis      # 분석 단계 진입 시
#   uv sync --extra ml            # ML 모델링 시
#   uv sync --all-extras          # 전부 (개발 환경)
[project.optional-dependencies]
analysis = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
]
ml = [
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "lightgbm>=4.5",
]
app = [
    "streamlit>=1.40",
    "plotly>=5.18",
]
# airflow는 의존성이 무거워 별도 환경에서 운영 권장
# airflow = ["apache-airflow>=2.8"]


# ── uv 설정 ─────────────────────────────────────────────
[tool.uv]
# 패키지 빌드/배포 안 함 (스크립트·노트북 중심 application 프로젝트)
package = false
